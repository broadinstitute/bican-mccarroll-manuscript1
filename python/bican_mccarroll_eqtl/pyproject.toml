[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bican_mccarroll_eqtl"
version = "0.1.0"

dependencies = [
    "numpy==1.24.3",
    "pandas==2.2.3",
    "scipy==1.10.1",
    "matplotlib==3.10.1",
    "scikit-learn==1.5.0",
    "anndata==0.11.4",
    "scanpy==1.11.1",
]

authors = [
  { name="Tracy Yuan", email="tracyyuan@broadinstitute.org" },
]
description = "eQTL clustering and visualization for BICAN McCarroll manuscript."
readme = "README.md"
requires-python = ">=3.10,<3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
test-eqtl-pipeline = "bican_mccarroll_eqtl.cli.test_eqtl_pipeline:main"
match-cluster-order = "bican_mccarroll_eqtl.cli.match_cluster_order:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bican_mccarroll_eqtl"]

[project.urls]
Homepage = "https://github.com/broadinstitute/bican-mccarroll-manuscript1/"
Issues = "https://github.com/broadinstitute/bican-mccarroll-manuscript1/issues"
